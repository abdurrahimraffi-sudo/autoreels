name: Reels Harian

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 19:00 WIB
  workflow_dispatch:         # biar bisa dijalankan manual dari tab Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependensi
        run: pip install edge-tts pillow requests

      - name: Buat video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python buat_video.py

      - name: Simpan riwayat topik
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add used_topics.json
          git diff --staged --quiet || (git commit -m "update riwayat topik" && git push)

      - name: Siapkan situs (video harian)
        run: |
          mkdir -p site
          cp output/reel.mp4 "site/reel-${{ github.run_id }}.mp4"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload ke Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python upload_ig.py "${PAGE_URL%/}/reel-${{ github.run_id }}.mp4"
