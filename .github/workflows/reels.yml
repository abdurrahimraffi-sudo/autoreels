name: Reels Harian

on:
  schedule:
    - cron: "7 5 * * *"     # 05:07 UTC = 12:07 WIB (siang)
  workflow_dispatch:
    inputs:
      mode:
        description: "kartun (cerita psikologi) atau fakta (fakta unik)"
        default: "kartun"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependensi
        run: pip install edge-tts pillow requests

      - name: Siapkan aset karakter
        run: |
          if [ -f aset_karakter.zip ]; then unzip -oq aset_karakter.zip; fi
          ls aset_karakter 2>/dev/null || echo "(belum ada folder aset_karakter)"

      - name: Buat video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python ${{ github.event.inputs.mode == 'fakta' && 'buat_video.py' || 'buat_video_kartun.py' }}

      - name: Simpan riwayat topik
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add used_topics.json
          git diff --staged --quiet || (git commit -m "update riwayat topik" && git push)

      - name: Siapkan situs (video harian)
        run: |
          mkdir -p site
          cp output/reel.mp4 "site/reel-${{ github.run_id }}.mp4"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload ke Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python upload_ig.py "${PAGE_URL%/}/reel-${{ github.run_id }}.mp4"
